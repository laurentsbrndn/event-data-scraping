name: Daily Loket Scraper

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  scrape-data:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 lxml deep-translator pyobjc
          playwright install chromium

      - name: Run Scraper Pipeline
        run: |
          python pipelines/scrape_daily.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/scraper.db data/processed_json/
          
          git commit -m "Auto-update: Scrape Loket Events [$(date +'%Y-%m-%d')]" || echo "Tidak ada perubahan untuk di-commit"
          
          git push